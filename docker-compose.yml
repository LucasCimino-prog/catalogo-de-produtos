# docker-compose.yml (versão inicial, só o banco)
services:
  mysql:
    image: mysql:8.4
    container_name: meuprojeto-mysql
    environment:
      MYSQL_ROOT_PASSWORD: minhasenha
      MYSQL_DATABASE: meuprojeto
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: